<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 255" width="760" height="255" role="img" aria-label="A message to 50,000 WebSockets">
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}</style>
<text x="0" y="22" font-size="17" font-weight="600" fill="#0D1B2E">A message to 50,000 WebSockets</text>
<text x="0" y="44" font-size="12.5" fill="#56677D">Milliseconds until the last socket has it (slowest of 8 messages), 8 workers; lower is better</text>
<line x1="170.0" y1="60" x2="170.0" y2="180" stroke="#D9E1EA" stroke-width="1"/>
<text x="170.0" y="196" font-size="11" text-anchor="middle" fill="#56677D">0 ms</text>
<line x1="266.0" y1="60" x2="266.0" y2="180" stroke="#D9E1EA" stroke-width="1"/>
<text x="266.0" y="196" font-size="11" text-anchor="middle" fill="#56677D">50 ms</text>
<line x1="362.0" y1="60" x2="362.0" y2="180" stroke="#D9E1EA" stroke-width="1"/>
<text x="362.0" y="196" font-size="11" text-anchor="middle" fill="#56677D">100 ms</text>
<line x1="458.0" y1="60" x2="458.0" y2="180" stroke="#D9E1EA" stroke-width="1"/>
<text x="458.0" y="196" font-size="11" text-anchor="middle" fill="#56677D">150 ms</text>
<line x1="554.0" y1="60" x2="554.0" y2="180" stroke="#D9E1EA" stroke-width="1"/>
<text x="554.0" y="196" font-size="11" text-anchor="middle" fill="#56677D">200 ms</text>
<line x1="650.0" y1="60" x2="650.0" y2="180" stroke="#D9E1EA" stroke-width="1"/>
<text x="650.0" y="196" font-size="11" text-anchor="middle" fill="#56677D">250 ms</text>
<line x1="170" y1="60" x2="170" y2="180" stroke="#9FB0C2" stroke-width="1"/>
<text x="160" y="79.5" font-size="12.5" font-weight="600" text-anchor="end" fill="#0D1B2E">swerve + phasync-ext</text>
<rect x="170" y="64" width="149.6" height="22" rx="3" fill="#5B93CC"/>
<text x="326.6" y="79.5" font-size="12" fill="#0D1B2E">78 ms</text>
<text x="160" y="108.5" font-size="12.5" font-weight="400" text-anchor="end" fill="#0D1B2E">ReactPHP 1.11</text>
<rect x="170" y="93" width="288.0" height="22" rx="3" fill="#B6C2CF"/>
<text x="465.0" y="108.5" font-size="12" fill="#0D1B2E">150 ms</text>
<text x="160" y="137.5" font-size="12.5" font-weight="400" text-anchor="end" fill="#0D1B2E">Swoole 6.2</text>
<rect x="170" y="122" width="382.1" height="22" rx="3" fill="#B6C2CF"/>
<text x="559.1" y="137.5" font-size="12" fill="#0D1B2E">199 ms</text>
<text x="160" y="166.5" font-size="12.5" font-weight="400" text-anchor="end" fill="#0D1B2E">OpenSwoole 26.2</text>
<rect x="170" y="151" width="389.8" height="22" rx="3" fill="#B6C2CF"/>
<text x="566.8" y="166.5" font-size="12" fill="#0D1B2E">203 ms</text>
<text x="0" y="230" font-size="11" fill="#56677D">Published from one worker, delivered through each server&#x27;s worker-to-worker channel.</text>
<text x="0" y="245" font-size="11" fill="#56677D">RoadRunner and FrankenPHP have no in-process WebSocket server. benchmarks/servers</text>
</svg>
