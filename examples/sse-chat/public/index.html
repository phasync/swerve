<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSE chat</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; height: 60vh; overflow-y: auto; padding: .5rem; }
  #log p { margin: .2rem 0; }
  form { display: flex; gap: .5rem; margin-top: .5rem; }
  #text { flex: 1; }
</style>
</head>
<body>
<div id="log"></div>
<form id="form">
  <input id="name" placeholder="name" size="10" required>
  <input id="text" placeholder="message" autocomplete="off" required>
  <button>Send</button>
</form>
<script>
const log = document.getElementById('log');
new EventSource('/events').onmessage = (event) => {
  const { name, text } = JSON.parse(event.data);
  const p = document.createElement('p');
  p.textContent = `${name}: ${text}`;
  log.append(p);
  log.scrollTop = log.scrollHeight;
};
document.getElementById('form').onsubmit = async (event) => {
  event.preventDefault();
  const text = document.getElementById('text');
  await fetch('/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: document.getElementById('name').value, text: text.value }),
  });
  text.value = '';
};
</script>
</body>
</html>
